{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="card bg-base-100 shadow-xl">

    <div class="card-body">

        <div class="flex flex-col md:flex-row gap-6 items-start">

            <img
                src="/media/uploads/semmelweis.jpeg"
                alt="Semmelweis"
                class="w-40 rounded-lg shadow-lg"
            >

            <div>

                <h1 class="text-4xl font-bold text-primary">
                    Semmelweis Handwashing Analysis
                </h1>

                <p class="mt-4 text-lg leading-relaxed">

                    Ignaz Semmelweis discovered that handwashing
                    dramatically reduced deaths in hospitals.

                </p>

                <div class="mt-6">

                    <a
                        href="/yearly/"
                        class="btn btn-primary"
                    >
                        Open Records
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
