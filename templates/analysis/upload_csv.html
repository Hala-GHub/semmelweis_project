{% extends "base.html" %}

{% block title %}
Upload CSV
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="card bg-base-100 shadow-xl">

        <div class="card-body">

            <h1 class="text-3xl font-bold mb-4">
                Upload Yearly CSV
            </h1>

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">
                    Upload CSV
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
