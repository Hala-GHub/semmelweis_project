{% extends "base.html" %}

{% block title %}
Add Record
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="card bg-base-100 shadow-xl">

        <div class="card-body">

            <h1 class="text-3xl font-bold mb-4">
                Add Yearly Record
            </h1>

            <form method="POST">

                {% csrf_token %}

                <div class="space-y-4">

                    {% for field in form %}

                        <div>

                            <label class="label">

                                <span class="label-text">
                                    {{ field.label }}
                                </span>

                            </label>

                            {{ field }}

                        </div>

                    {% endfor %}

                </div>

                <div class="mt-6">

                    <button class="btn btn-primary">
                        Save Record
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
